name: deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firmware/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.firmware == 'true' || steps.f.outputs.workflow == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.web == 'true' || steps.f.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            firmware: 'firmware/**'
            web: 'web/**'
            workflow: '.github/workflows/deploy.yml'

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --upgrade platformio
      - run: pio run
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/.pio/build/*/firmware.hex
          if-no-files-found: error

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo install topcoat-cli --locked
      - run: cargo build --release
      - run: topcoat asset bundle --release
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: |
            web/target/${{ env.CARGO_BUILD_TARGET }}/release/web
            web/target/${{ env.CARGO_BUILD_TARGET }}/release/assets
          if-no-files-found: error

  deploy:
    needs: [changes, firmware, web]
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, plant-watering]
    concurrency: deploy
    env:
      SERVICE: plant-web
      INSTALL_PATH: /opt/plant
      PORT: /dev/serial/by-id/usb-Arduino_LLC_Arduino_Leonardo-if00
      BAUD: 57600
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Deploy
        run: |
          set -euo pipefail

          PREV="${INSTALL_PATH}.prev"

          restore() {
            echo "deploy failed, restoring previous web build"
            if [ -d "$PREV" ]; then
              rm -rf "$INSTALL_PATH"
              mv "$PREV" "$INSTALL_PATH"
            fi
            sudo systemctl restart "$SERVICE" || true
          }
          trap restore ERR

          rm -rf "$PREV"
          if [ -d "$INSTALL_PATH" ]; then
            cp -a "$INSTALL_PATH" "$PREV"
          fi

          sudo systemctl stop "$SERVICE"

          if [ -f dist/firmware.hex ]; then
            stty -F "$PORT" 1200
            sleep 2
            avrdude -p atmega32u4 -c avr109 -P "$PORT" -b "$BAUD" -D \
              -U flash:w:dist/firmware.hex:i
          fi

          if [ -f dist/web ]; then
            mkdir -p "$INSTALL_PATH"
            rm -rf "$INSTALL_PATH/assets"
            install -m 755 dist/web "$INSTALL_PATH/web"
            cp -a dist/assets "$INSTALL_PATH/assets"
          fi

          sudo systemctl start "$SERVICE"
          sleep 3
          systemctl is-active --quiet "$SERVICE"

          trap - ERR
          rm -rf "$PREV"
