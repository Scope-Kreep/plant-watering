name: deploy

on:
  push:
    branches: [main]
    paths:
      - "pi/**"
      - "firmware/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: aarch64-unknown-linux-gnu
  BIN: plant-web

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.firmware == 'true' || steps.f.outputs.workflow == 'true' }}
      pi: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.pi == 'true' || steps.f.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            firmware: 'firmware/**'
            pi: 'pi/**'
            workflow: '.github/workflows/deploy.yml'

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --upgrade platformio
      - run: pio run
      - run: cp .pio/build/*/firmware.hex firmware.hex
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/firmware.hex

  web:
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --target $TARGET
      - run: cp target/$TARGET/release/$BIN ./$BIN
      - uses: actions/upload-artifact@v7
        with:
          name: pi
          path: pi/${{ env.BIN }}

  deploy:
    needs: [firmware, web]
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, plant-watering]
    concurrency: deploy
    env:
      SERVICE: plant-web
      INSTALL_PATH: /opt/plant/plant-web
      PORT: /dev/serial/by-id/usb-Arduino_LLC_Arduino_Leonardo-if00
      BAUD: 57600
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Deploy
        run: |
          set -euo pipefail
          [ -f "$INSTALL_PATH" ] && cp "$INSTALL_PATH" "$INSTALL_PATH.prev" || true

          rollback() {
            echo "deploy failed, restoring previous binary"
            [ -f "$INSTALL_PATH.prev" ] && install -m 755 "$INSTALL_PATH.prev" "$INSTALL_PATH"
            sudo systemctl start "$SERVICE"
          }
          trap rollback ERR

          sudo systemctl stop "$SERVICE"

          if [ -f dist/firmware.hex ]; then
            avrdude -p atmega32u4 -c avr109 -P "$PORT" -b "$BAUD" -r -D \
              -U flash:w:dist/firmware.hex:i
          fi

          if [ -f "dist/$BIN" ]; then
            install -m 755 "dist/$BIN" "$INSTALL_PATH"
          fi

          sudo systemctl start "$SERVICE"

          sleep 3
          systemctl is-active --quiet "$SERVICE"
