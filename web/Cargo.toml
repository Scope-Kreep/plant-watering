[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.14"
jiff = "0.2.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toasty = { version = "0.11", features = ["sqlite", "jiff"] }
toasty-cli = "0.11"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
tokio-serial = "5.5.0"
topcoat = { version = "0.12.1", default-features = false, features = ["asset", "discover", "font-fontsource", "icon-iconify", "router", "runtime", "serve", "tailwind", "ui", "view"] }

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify", "tailwind"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
